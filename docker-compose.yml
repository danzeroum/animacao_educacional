# Forja — sobe backend (FastAPI+LangGraph+Playwright) e frontend (nginx) juntos.
#   1) copie backend/.env.example → backend/.env e preencha as chaves (opcional)
#   2) docker compose up --build
#   3) abra http://localhost:8080   (API em http://localhost:8000)
#
# Segurança: FORJA_DRY_RUN=true por padrão — nada é publicado. Para abrir PRs de
# verdade, defina FORJA_DRY_RUN=false e GITHUB_TOKEN no backend/.env.

services:
  backend:
    build:
      context: ./backend
    environment:
      REPO_ROOT: /repo
      FORJA_DB: /app/forja.db
      FORJA_DRY_RUN: "true"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # monta o repo dos objetos: o pipeline grava {slug}/ e atualiza o Atlas aqui.
      - ./:/repo
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
